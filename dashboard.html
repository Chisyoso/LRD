<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colegio Verde | Dashboard</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/components.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/app.js" defer></script>

</head>
<body>
  <div data-shell>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <h1>Dashboard</h1>
            <p class="small">Acceso central según rol y estado de la cuenta.</p>
          </div>
          <div class="pill">Moderación sin favoritismos</div>
        </div>

        <div id="dashboard-stats" class="grid grid-4"></div>

        <div class="section" id="dashboard-access"></div>

        <div class="grid grid-2">
          <div class="panel">
            <h3>Accesos rápidos</h3>
            <div class="form-actions">
              <a class="btn primary" href="publicaciones.html">Nueva publicación</a>
              <a class="btn ghost" href="noticias.html">Ir a noticias</a>
              <a class="btn ghost" href="foro.html">Entrar al foro</a>
            </div>
          </div>
          <div class="panel">
            <h3>Seguridad</h3>
            <p class="small">RLS, logs, strikes, apelaciones y aprobación previa para imágenes.</p>
          </div>
        </div>
      </div>
    </section>

  </div>
</body>
</html>
