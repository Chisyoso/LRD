<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colegio Verde | Publicaciones</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/components.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/app.js" defer></script>

</head>
<body>
  <div data-shell>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <h1>Publicaciones</h1>
            <p class="small">La publicación normal entra primero a moderación. El rechazo exige motivo obligatorio.</p>
          </div>
        </div>

        <div class="grid grid-2">
          <div class="panel">
            <h3>Nueva publicación</h3>
            <form class="form-grid">
              <input class="input" placeholder="Texto corto">
              <input class="input" placeholder="URL de imagen">
              <input class="input" placeholder="Etiquetas separadas por coma">
              <button class="btn primary" type="button">Enviar a cola</button>
            </form>
          </div>

          <div class="panel">
            <h3>Cola de moderación</h3>
            <div id="moderation-queue" class="list"></div>
          </div>
        </div>

        <div class="section">
          <div class="section-head"><h2>Contenido visible</h2></div>
          <div id="post-list" class="grid grid-2"></div>
        </div>
      </div>
    </section>

  </div>
</body>
</html>
