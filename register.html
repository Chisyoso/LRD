<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colegio Verde | Registro</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/components.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/app.js" defer></script>

</head>
<body>
  <div data-shell>

    <section class="section">
      <div class="container">
        <div class="auth-card">
          <h1>Registro</h1>
          <p class="small">Roles especiales quedan en estado pendiente hasta validación.</p>

          <form id="register-form" class="form-grid">
            <div class="grid grid-2">
              <input class="input" name="name" placeholder="Nombre" required>
              <input class="input" name="username" placeholder="Usuario" required>
            </div>
            <div class="grid grid-2">
              <input class="input" type="email" name="contact" placeholder="Correo o medio de contacto" required>
              <input class="input" name="avatar" placeholder="URL de foto de perfil">
            </div>
            <div class="grid grid-2">
              <input class="input" name="phone" id="phone" placeholder="Número de contacto">
              <select class="select" name="role_request" id="role-request" required>
                <option value="usuario">Usuario normal</option>
                <option value="reportero">Reportero</option>
                <option value="staff">Staff</option>
                <option value="moderador">Moderador</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <textarea class="textarea" name="validation" placeholder="Respuestas de validación / justificación del rol solicitado"></textarea>
            <input class="input" type="password" name="password" placeholder="Contraseña" required minlength="8">
            <div class="notice green">Estado inicial: <strong id="role-status">activo</strong></div>
            <button class="btn primary" type="submit">Crear cuenta</button>
          </form>
        </div>
      </div>
    </section>

  </div>
</body>
</html>
