<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · LRD</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-page="login">
  <div id="appHeader"></div>
  <main class="container">
    
<section class="section">
  <div class="grid two">
    <div class="panel">
      <h1>Iniciar sesión</h1>
      <form id="loginForm" class="form">
        <label class="field"><span>Correo</span><input id="email" type="email" required></label>
        <label class="field"><span>Contraseña</span><input id="password" type="password" required></label>
        <button class="btn btn-green" type="submit">Entrar</button>
      </form>
    </div>
    <div class="panel">
      <h2>Acceso al sistema</h2>
      <p class="muted">El frontend usa Supabase Auth. No guarda contraseñas en texto plano.</p>
      <a class="btn btn-dark" href="register.html">Crear cuenta</a>
    </div>
  </div>
</section>

  </main>
  <div id="appFooter"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
