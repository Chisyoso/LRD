<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colegio Verde | Login</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/components.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/app.js" defer></script>

</head>
<body>
  <div data-shell>

    <section class="section">
      <div class="container grid" style="max-width:520px">
        <div class="auth-card">
          <h1>Iniciar sesión</h1>
          <p class="small">Usa Supabase Auth. La base no guarda contraseñas en texto plano.</p>
          <form id="login-form" class="form-grid">
            <input class="input" type="email" name="email" placeholder="Correo" required>
            <input class="input" type="password" name="password" placeholder="Contraseña" required>
            <button class="btn primary" type="submit">Entrar</button>
          </form>
          <p class="small" style="margin-top:1rem">¿No tienes cuenta? <a href="register.html"><u>Registrarse</u></a></p>
        </div>
      </div>
    </section>

  </div>
</body>
</html>
