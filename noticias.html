<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colegio Verde | Noticias</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/components.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/app.js" defer></script>

</head>
<body>
  <div data-shell>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <h1>Noticias</h1>
            <p class="small">Solo personal autorizado. Con imagen, título, contenido, etiquetas y búsqueda.</p>
          </div>
        </div>

        <div class="toolbar">
          <input id="news-search" class="input" placeholder="Buscar noticias...">
          <select id="news-filter" class="select">
            <option value="all">Todas las categorías</option>
            <option>Académico</option>
            <option>Deportes</option>
            <option>Cultura</option>
            <option>Tecnología</option>
            <option>Convocatoria</option>
          </select>
        </div>

        <div id="news-list" class="grid grid-2"></div>
      </div>
    </section>

  </div>
</body>
</html>
